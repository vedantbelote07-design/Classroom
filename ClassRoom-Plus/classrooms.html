<div class="page-header"><div class="container"><span class="section-label">ROOM DIRECTORY</span><h1>Classrooms & Labs</h1><p>Find a suitable room using the filters below.</p></div></div>

<main class="container py-5">
<div class="filter-box mb-4">
<div class="row g-3 align-items-end">
<div class="col-5"><label class="form-label" for="roomSearch">Search Classroom</label><input id="roomSearch" class="form-control" placeholder="e.g. Classroom CS6"></div>
<div class="col-3"><label class="form-label" for="capacityFilter">Capacity</label><select id="capacityFilter" class="form-select"><option value="">All</option><option value="40">40+</option><option value="60">60+</option><option value="100">100+</option></select></div>
<div class="col-2"><label class="form-label" for="facilityFilter">Facility</label><select id="facilityFilter" class="form-select"><option value="">All</option><option value="Projector">Projector</option><option value="Smart Board">Smart Board</option><option value="Computer">Computer</option></select></div>
<div class="col-2"><button class="btn btn-primary w-100" onclick="searchClassrooms()"><i class="bi bi-search"></i> Search</button></div>
</div>
</div>
<div id="roomList" class="row g-4"></div>
<div id="noRooms" class="empty-state d-none"><i class="bi bi-search"></i><h4>No classrooms found</h4><p>Try changing your filters.</p></div>
</main>
