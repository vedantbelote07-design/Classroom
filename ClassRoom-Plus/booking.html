<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Book Slot | ClassRoom+</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>

<body>
    <nav class="navbar navbar-expand navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-building"></i> ClassRoom+</a>
            <div class="navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="classrooms.html">Classrooms</a></li>
                    <li class="nav-item"><a class="nav-link" href="slots.html">Availability</a></li>
                    <li class="nav-item"><a class="nav-link active" href="booking.html">Book Slot</a></li>
                    <li class="nav-item"><a class="nav-link" href="bookings.html">My Bookings</a></li>
                    <li class="nav-item"><a class="btn btn-light btn-sm ms-2" href="admin.html">Admin</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="page-header">
        <div class="container"><span class="section-label">RESERVATION</span>
            <h1>Book a Classroom</h1>
            <p>Complete the form to reserve an available classroom slot.</p>
        </div>
    </div>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-8">
                <div class="form-card">
                    <form id="bookingForm" onsubmit="return validateBooking(event)">
                        <div class="row g-3">
                            <div class="col-6"><label class="form-label" for="name">Full Name *</label><input id="name"
                                    class="form-control" placeholder="Enter your name"></div>
                            <div class="col-6"><label class="form-label" for="email">Email *</label><input id="email"
                                    type="email" class="form-control" placeholder="name@college.edu"></div>
                            <div class="col-6"><label class="form-label" for="bookingDate">Booking Date *</label><input
                                    id="bookingDate" type="date" class="form-control"></div>
                            <div class="col-6"><label class="form-label" for="bookingRoom">Classroom *</label><select
                                    id="bookingRoom" class="form-select"></select></div>
                            <div class="col-6"><label class="form-label" for="bookingSlot">Time Slot *</label><select
                                    id="bookingSlot" class="form-select"></select></div>
                            <div class="col-6"><label class="form-label" for="purpose">Purpose *</label><select
                                    id="purpose" class="form-select">
                                    <option value="">Select purpose</option>
                                    <option>Lecture</option>
                                    <option>Project Discussion</option>
                                    <option>Seminar</option>
                                    <option>Workshop</option>
                                    <option>Club Activity</option>
                                    <option>Other</option>
                                </select></div>
                            <div class="col-12"><label class="form-label" for="description">Description</label><textarea
                                    id="description" class="form-control" rows="4"
                                    placeholder="Briefly describe the purpose of booking"></textarea></div>
                            <div class="col-12">
                                <div id="formMessage"></div>
                            </div>
                            <div class="col-12"><button class="btn btn-primary btn-lg w-100" type="submit"><i
                                        class="bi bi-calendar-check"></i> Confirm Booking</button></div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container text-center">
            <h5>ClassRoom+</h5><small>Web Designing Project By Aditya &amp; Vedant</small>
        </div>
    </footer>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script src="js/booking.js"></script>
    <script src="js/animations.js"></script>
</body>

</html>
