<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Availability | ClassRoom+</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>

<body>
    <nav class="navbar navbar-expand navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-building"></i> ClassRoom+</a>
            <div class="navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="classrooms.html">Classrooms</a></li>
                    <li class="nav-item"><a class="nav-link active" href="slots.html">Availability</a></li>
                    <li class="nav-item"><a class="nav-link" href="booking.html">Book Slot</a></li>
                    <li class="nav-item"><a class="nav-link" href="bookings.html">My Bookings</a></li>
                    <li class="nav-item"><a class="btn btn-light btn-sm ms-2" href="admin.html">Admin</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="page-header">
        <div class="container"><span class="section-label">SCHEDULE</span>
            <h1>Check Availability</h1>
            <p>Select a date and classroom to view its time slots.</p>
        </div>
    </div>
    <main class="container py-5">
        <div class="filter-box mb-4">
            <div class="row g-3 align-items-end">
                <div class="col-4"><label class="form-label" for="slotDate">Date</label><input type="date" id="slotDate"
                        class="form-control"></div>
                <div class="col-4"><label class="form-label" for="slotRoom">Classroom</label><select id="slotRoom"
                        class="form-select"></select></div>
                <div class="col-4"><button class="btn btn-primary w-100" onclick="showSlots()">View Slots</button></div>
            </div>
        </div>
        <div class="legend mb-3"><span><i class="dot available-dot"></i> Available</span><span><i
                    class="dot booked-dot"></i> Booked</span><span id="slotSummary" class="ms-auto fw-semibold"></span>
        </div>
        <div id="slotList" class="row g-3"></div>
    </main>
    <footer class="footer">
        <div class="container text-center">
            <h5>ClassRoom+</h5><small>Web Designing Project By Aditya &amp; Vedant</small>
        </div>
    </footer>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script src="js/booking.js"></script>
    <script src="js/animations.js"></script>
</body>

</html>
